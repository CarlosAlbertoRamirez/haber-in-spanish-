<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El verbo HABER | Your Mexican Friend</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#25d9ff;--magenta:#ff2bbf;--magenta2:#ff4fd8;
  --bg1:#070019;--bg2:#160033;--text:#f0f0ff;--muted:#a8abce;--muted2:#5a5d8a;
  --good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --a1:#34d399;--a2:#f97316;--b1:#60a5fa;--b1p:#a78bfa;
  --font:'DM Sans',system-ui,sans-serif;--display:'Syne',system-ui,sans-serif;
  --shadow:0 20px 40px rgba(0,0,0,.4),0 0 28px rgba(37,217,255,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:radial-gradient(ellipse at 20% 10%,rgba(167,139,250,.12),transparent 35%),radial-gradient(ellipse at 80% 15%,rgba(34,211,153,.07),transparent 35%),linear-gradient(155deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh}
.app{width:min(940px,96%);margin:14px auto 60px;display:flex;flex-direction:column;gap:14px}
/* HERO */
.hero{border-radius:22px;padding:26px 30px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(255,255,255,.09);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:36px 36px;pointer-events:none}
.hero-in{position:relative;z-index:1}
.hero-top{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.logo-box{width:56px;height:56px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#0c0030,#280060);border:2px solid rgba(37,217,255,.28);font-family:var(--display);font-size:.85rem;font-weight:900;color:var(--magenta)}
.hero h1{font-family:var(--display);font-size:clamp(1.2rem,3vw,2rem);font-weight:900;background:linear-gradient(90deg,var(--a1),#fff 40%,var(--b1p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--muted);font-size:.86rem;margin-top:3px;line-height:1.55}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px 11px;font-size:.7rem;font-weight:700;color:var(--muted)}
/* SECTION SELECTOR */
.sec-selector{display:flex;gap:10px;flex-wrap:wrap}
.sec-btn{border:0;border-radius:12px;padding:12px 20px;font-weight:800;font-family:var(--display);font-size:.88rem;cursor:pointer;transition:.18s;border:2px solid transparent;flex:1;min-width:200px}
.sec-btn.existencia{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3);color:var(--a1)}
.sec-btn.existencia.active{background:rgba(52,211,153,.2);border-color:var(--a1);box-shadow:0 0 20px rgba(52,211,153,.2)}
.sec-btn.auxiliar{background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.3);color:var(--b1p)}
.sec-btn.auxiliar.active{background:rgba(167,139,250,.2);border-color:var(--b1p);box-shadow:0 0 20px rgba(167,139,250,.2)}
.sec-btn:hover{transform:translateY(-2px)}
/* TABS */
.tabs-wrap{background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.tabs-bar{display:flex;overflow-x:auto;border-bottom:1px solid rgba(255,255,255,.07);scrollbar-width:none}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;border:0;background:transparent;color:var(--muted2);font-family:var(--font);font-size:.78rem;font-weight:700;padding:12px 16px;cursor:pointer;transition:.2s;border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{border-bottom-color:var(--cyan);color:var(--cyan)}
.level-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tab-panel{display:none;padding:28px 30px}.tab-panel.visible{display:block}
/* EXPLANATION BOX */
.expl-box{background:rgba(255,255,255,.03);border:1.5px solid rgba(37,217,255,.15);border-radius:16px;padding:20px 22px;margin-bottom:22px}
.expl-title{font-family:var(--display);font-size:1rem;font-weight:900;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.expl-body{font-size:.9rem;color:var(--muted);line-height:1.9}
.expl-body strong{color:var(--text);font-weight:800}
.expl-body em{color:var(--cyan);font-style:normal;font-weight:700}
.struct-box{background:rgba(37,217,255,.06);border:1px solid rgba(37,217,255,.2);border-radius:10px;padding:10px 16px;margin:10px 0;font-family:var(--display);font-size:.95rem;font-weight:800;color:var(--cyan);letter-spacing:.02em}
.example-list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.example-item{background:rgba(255,255,255,.03);border-radius:10px;padding:10px 14px;border-left:3px solid}
.example-item .es{font-weight:700;font-size:.93rem;margin-bottom:3px}
.example-item .en{font-size:.82rem;color:var(--muted2);font-style:italic}
.example-item .note{font-size:.75rem;color:var(--muted2);margin-top:4px}
.warning-box{background:rgba(239,68,68,.07);border:1.5px solid rgba(239,68,68,.25);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:.85rem;line-height:1.7}
.warning-box strong{color:#fca5a5}
.contrast-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.contrast-card{border-radius:10px;padding:12px 14px;border:1.5px solid}
.contrast-card .label{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.contrast-card .sent{font-weight:700;font-size:.9rem;margin-bottom:3px}
.contrast-card .note{font-size:.78rem;color:var(--muted2)}
/* SUMMARY TABLE */
.sum-table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:10px}
.sum-table th{text-align:left;padding:7px 12px;font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);border-bottom:1px solid rgba(255,255,255,.08)}
.sum-table td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04)}
.sum-table td:first-child{font-family:var(--display);font-weight:900;color:var(--cyan)}
.sum-table td:nth-child(2){color:var(--muted)}
.sum-table td:last-child{color:var(--muted2);font-style:italic}
.sum-table tr:last-child td{border-bottom:0}
/* EXERCISES */
.ex-wrap{display:flex;flex-direction:column;gap:16px}
.ex-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.07);border-radius:14px;padding:18px 20px}
.ex-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.ex-title{font-family:var(--display);font-size:.82rem;font-weight:900;color:var(--cyan);text-transform:uppercase;letter-spacing:.05em}
.score-row{display:flex;align-items:center;gap:8px}
.score-pill{background:rgba(167,139,250,.15);color:#c4b5fd;border-radius:999px;padding:3px 12px;font-size:.7rem;font-weight:800;border:1px solid rgba(167,139,250,.3)}
.btn-restart{border:1px solid rgba(249,115,22,.35);border-radius:999px;padding:3px 10px;font-weight:800;font-family:var(--font);font-size:.68rem;cursor:pointer;background:rgba(249,115,22,.08);color:var(--a2);transition:.13s}
.btn-restart:hover{background:rgba(249,115,22,.18)}
.wordbank{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:9px 13px;margin-bottom:14px;font-size:.82rem;color:var(--muted2)}
.wordbank strong{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px}
.q-list{display:flex;flex-direction:column;gap:12px}
.q-item{font-size:.92rem;line-height:1.7}
.q-num{font-size:.68rem;font-weight:900;color:var(--muted2);margin-right:4px}
.q-stem{font-weight:600;margin-bottom:5px;line-height:1.65}
.q-sub{font-size:.8rem;color:var(--muted2);font-style:italic;margin-bottom:6px;border-left:2px solid rgba(37,217,255,.2);padding-left:8px}
/* CHIPS */
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chip{border:0;border-radius:9px;padding:7px 14px;font-weight:800;font-family:var(--display);font-size:.88rem;cursor:pointer;transition:.13s;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.11);color:var(--text)}
.chip:hover:not([disabled]):not(.used){transform:translateY(-2px);border-color:rgba(37,217,255,.4)}
.chip.used{opacity:.18;cursor:not-allowed}
.chip.chip-ok{border-color:var(--good);background:rgba(34,197,94,.18);color:#86efac}
.chip.chip-err{border-color:var(--bad);background:rgba(239,68,68,.14);color:#fca5a5}
.blank{display:inline-block;border-bottom:2px solid var(--cyan);min-width:100px;text-align:center;padding:0 4px;color:var(--cyan);font-weight:800;font-family:var(--display)}
/* INPUT */
.q-input{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:9px;padding:9px 13px;color:var(--text);font-family:var(--font);font-size:.9rem;outline:none;transition:.2s;width:100%;margin-bottom:4px}
.q-input:focus{border-color:rgba(37,217,255,.4);background:rgba(37,217,255,.04)}
.q-input[disabled]{opacity:.65;cursor:default}
.q-input.inp-ok{border-color:var(--good);background:rgba(34,197,94,.06)}
.q-input.inp-err{border-color:var(--bad);background:rgba(239,68,68,.05)}
/* BUTTONS */
.btn-check{border:0;border-radius:8px;padding:7px 16px;font-weight:800;font-family:var(--font);font-size:.8rem;cursor:pointer;transition:.13s;background:rgba(37,217,255,.12);border:1.5px solid rgba(37,217,255,.28);color:var(--cyan);margin-top:6px}
.btn-check:hover{background:rgba(37,217,255,.2)}
.btn-check[disabled]{opacity:.4;cursor:default}
/* FEEDBACK */
.q-fb{display:none;font-size:.8rem;color:var(--muted);margin-top:6px;padding:7px 11px;border-radius:8px;background:rgba(255,255,255,.04);line-height:1.6}
.q-fb.show{display:block}
/* FLASHCARDS */
.fc-scene{perspective:900px;width:100%;max-width:420px;margin:0 auto 16px;height:180px;cursor:pointer}
.fc-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:18px;text-align:center;border:1.5px solid}
.fc-front{background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.3)}
.fc-back{transform:rotateY(180deg);background:rgba(37,217,255,.07);border-color:rgba(37,217,255,.3)}
.fc-label{font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);margin-bottom:8px}
.fc-form{font-family:var(--display);font-size:1.8rem;font-weight:900;color:var(--text);margin-bottom:4px}
.fc-eng{font-size:.9rem;color:var(--muted);font-style:italic}
.fc-example{font-size:.82rem;color:var(--muted2);margin-top:6px;line-height:1.5}
.fc-nav{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px}
.fc-counter{font-size:.78rem;font-weight:800;color:var(--muted2)}
.btn-fc{border:0;border-radius:9px;padding:7px 18px;font-weight:800;font-family:var(--font);font-size:.82rem;cursor:pointer;transition:.13s;background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.12)}
.btn-fc:hover{background:rgba(255,255,255,.14)}
.creator{text-align:center;color:#4a4d78;font-size:.76rem;font-weight:700;margin-top:4px}
.creator span{color:var(--magenta2)}
@media(max-width:560px){.tab-panel{padding:18px 14px}.contrast-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="hero">
  <div class="hero-in">
    <div class="hero-top">
      <div class="logo-box">YMF</div>
      <div>
        <h1>El verbo HABER</h1>
        <p>Existencia · Tiempos compuestos · Niveles A1–B1+ · Español mexicano neutro</p>
      </div>
    </div>
    <div class="badges">
      <span class="badge" style="border-color:rgba(52,211,153,.4);color:var(--a1)">🟢 A1 — Hay</span>
      <span class="badge" style="border-color:rgba(249,115,22,.4);color:var(--a2)">🟡 A2 — Había/Hubo</span>
      <span class="badge" style="border-color:rgba(96,165,250,.4);color:var(--b1)">🔵 B1 — Tiempos compuestos</span>
      <span class="badge" style="border-color:rgba(167,139,250,.4);color:var(--b1p)">🟣 B1+ — Subjuntivo</span>
      <span class="badge">By Carlos &amp; Denisse</span>
    </div>
  </div>
</header>
<div class="sec-selector">
  <button class="sec-btn existencia active" onclick="showSection('existencia')">🌍 HABER de existencia<br><small style="font-weight:600;opacity:.7">hay · había · hubo · habrá · habría · haya · hubiera</small></button>
  <button class="sec-btn auxiliar" onclick="showSection('auxiliar')">⚙️ HABER auxiliar<br><small style="font-weight:600;opacity:.7">he hablado · había comido · habré vivido · habría ido</small></button>
</div>
<div class="tabs-wrap" id="tabsWrap">
  <div class="tabs-bar" id="tabsBar"></div>
  <div id="tabContents"></div>
</div>
<p class="creator">By <span>Carlos &amp; Denisse</span> · yourmexicanfriend.com</p>
</div>
<script>
const SECTIONS={
existencia:[
// ── TAB 0: HAY (A1) ──────────────────────────────────────────────────────────
{level:'A1',color:'var(--a1)',icon:'🟢',title:'HAY',subtitle:'there is / there are',
expl:{
  title:'HAY = there is / there are',
  body:`<strong>Hay</strong> se usa para expresar existencia en el presente.<br>
  Es <em>impersonal</em>: no cambia con singular ni plural.<br><br>
  <div class="struct-box">hay + sustantivo</div>
  <div class="example-list">
    <div class="example-item" style="border-color:var(--a1)">
      <div class="es">Hay un restaurante cerca de mi casa.</div>
      <div class="en">There is a restaurant near my house.</div>
    </div>
    <div class="example-item" style="border-color:var(--a1)">
      <div class="es">Hay muchas personas en el parque.</div>
      <div class="en">There are many people in the park.</div>
    </div>
    <div class="example-item" style="border-color:var(--a1)">
      <div class="es">No hay suficiente comida.</div>
      <div class="en">There isn't enough food.</div>
    </div>
    <div class="example-item" style="border-color:var(--a1)">
      <div class="es">¿Hay algún problema?</div>
      <div class="en">Is there a problem?</div>
    </div>
  </div>
  <div class="warning-box">⚠️ <strong>Importante:</strong> HAY es siempre singular aunque el sustantivo sea plural.<br>
  ✅ <strong>Hay</strong> muchas personas. &nbsp;❌ <del>Han</del> muchas personas.</div>`,
},
flashcards:[
  {front:'HAY',frontSub:'presente',back:'there is / there are',example:'Hay un libro en la mesa. / There is a book on the table.'},
  {front:'No hay',frontSub:'negativo',back:"there isn't / there aren't",example:'No hay leche en el refri. / There is no milk in the fridge.'},
  {front:'¿Hay...?',frontSub:'pregunta',back:'Is there...? / Are there...?',example:'¿Hay algún baño por aquí? / Is there a bathroom nearby?'},
],
exercises:[
  {type:'fill',title:'A. Completa con HAY o NO HAY',
   wb:['Hay','No hay'],
   qs:[
     {stem:'___ un supermercado cerca de aquí.',sub:'There is a supermarket near here.',a:'Hay'},
     {stem:'___ suficiente tiempo para terminar.',sub:"There isn't enough time to finish.",a:'No hay'},
     {stem:'___ tres recámaras en la casa.',sub:'There are three bedrooms in the house.',a:'Hay'},
     {stem:'___ clases el domingo.',sub:"There aren't classes on Sunday.",a:'No hay'},
     {stem:'___ mucho tráfico en las mañanas.',sub:'There is a lot of traffic in the mornings.',a:'Hay'},
     {stem:'___ ningún problema con el pedido.',sub:"There isn't any problem with the order.",a:'No hay'},
   ]},
  {type:'translate',title:'B. Traduce al español (ES)',
   qs:[
     {stem:'There is a pharmacy near my house.',a:'Hay una farmacia cerca de mi casa.'},
     {stem:'There are many students in the class.',a:'Hay muchos estudiantes en la clase.'},
     {stem:"There isn't enough food for everyone.",a:'No hay suficiente comida para todos.'},
     {stem:'Is there a problem with the reservation?',a:'¿Hay algún problema con la reservación?'},
     {stem:'There are two restaurants on this street.',a:'Hay dos restaurantes en esta calle.'},
   ]},
  {type:'translate',title:'C. Traduce al inglés (EN)',
   qs:[
     {stem:'Hay una tienda en la esquina.',a:'There is a store on the corner.'},
     {stem:'¿Hay algún hospital cerca?',a:'Is there a hospital nearby?'},
     {stem:'No hay luz en el cuarto.',a:"There is no light in the room. / There isn't any light in the room."},
     {stem:'Hay veinte personas esperando.',a:'There are twenty people waiting.'},
   ]},
]},

// ── TAB 1: HABÍA & HUBO (A2) ─────────────────────────────────────────────────
{level:'A2',color:'var(--a2)',icon:'🟡',title:'HABÍA & HUBO',subtitle:'there was / there were',
expl:{
  title:'HABÍA vs HUBO — ¡diferencia importante!',
  body:`Ambas equivalen a <em>there was / there were</em>, pero se usan de forma diferente.<br><br>
  <div class="contrast-grid">
    <div class="contrast-card" style="border-color:rgba(249,115,22,.4);background:rgba(249,115,22,.06)">
      <div class="label" style="color:var(--a2)">HABÍA = descripción</div>
      <div class="sent">Había mucha gente en la calle.</div>
      <div class="note">→ Describe cómo era la situación.</div>
    </div>
    <div class="contrast-card" style="border-color:rgba(96,165,250,.4);background:rgba(96,165,250,.06)">
      <div class="label" style="color:var(--b1)">HUBO = evento</div>
      <div class="sent">Hubo una manifestación en la calle.</div>
      <div class="note">→ Habla de un acontecimiento específico.</div>
    </div>
  </div>
  <div class="example-list" style="margin-top:14px">
    <div class="example-item" style="border-color:var(--a2)">
      <div class="es">Cuando era niño, había menos tráfico.</div>
      <div class="en">When I was a child, there was less traffic.</div>
      <div class="note">→ Descripción de una situación pasada habitual.</div>
    </div>
    <div class="example-item" style="border-color:var(--b1)">
      <div class="es">Ayer hubo un accidente en la carretera.</div>
      <div class="en">There was an accident on the highway yesterday.</div>
      <div class="note">→ Evento específico y terminado.</div>
    </div>
    <div class="example-item" style="border-color:var(--a2)">
      <div class="es">Antes había una cafetería aquí.</div>
      <div class="en">There used to be a café here.</div>
    </div>
    <div class="example-item" style="border-color:var(--b1)">
      <div class="es">La semana pasada hubo una reunión importante.</div>
      <div class="en">There was an important meeting last week.</div>
    </div>
  </div>
  <div class="warning-box">⚠️ Igual que HAY, son <strong>impersonales</strong>:<br>
  ✅ <strong>Había</strong> muchos problemas. &nbsp;❌ <del>Habían</del> muchos problemas.</div>`,
},
flashcards:[
  {front:'HABÍA',frontSub:'descripción pasada',back:'there was / there were (description)',example:'Había mucha gente en la fiesta. / There were many people at the party.'},
  {front:'HUBO',frontSub:'evento pasado',back:'there was / there were (event)',example:'Anoche hubo una tormenta. / There was a storm last night.'},
  {front:'Antes había...',frontSub:'situación habitual',back:'there used to be...',example:'Antes había un parque aquí. / There used to be a park here.'},
],
exercises:[
  {type:'fill',title:'A. ¿HABÍA o HUBO?',
   wb:['Había','Hubo'],
   qs:[
     {stem:'___ muchas personas en la fiesta.',sub:'There were many people at the party. (description)',a:'Había'},
     {stem:'Ayer ___ un accidente terrible.',sub:'There was a terrible accident yesterday. (event)',a:'hubo'},
     {stem:'Cuando era pequeña, ___ un lago cerca de mi casa.',sub:'When I was little, there was a lake near my house.',a:'había'},
     {stem:'La semana pasada ___ una reunión urgente.',sub:'There was an urgent meeting last week. (event)',a:'hubo'},
     {stem:'Antes ___ menos contaminación en la ciudad.',sub:'There used to be less pollution in the city.',a:'había'},
     {stem:'Anoche ___ una tormenta muy fuerte.',sub:'There was a very strong storm last night. (event)',a:'hubo'},
   ]},
  {type:'translate',title:'B. Traduce al español',
   qs:[
     {stem:'There were many people at the hotel.',a:'Había muchas personas en el hotel.'},
     {stem:'There was an accident yesterday.',a:'Ayer hubo un accidente.'},
     {stem:'When I was a child, there were fewer cars.',a:'Cuando era niño/a, había menos coches / carros.'},
     {stem:'There was an important meeting last week.',a:'La semana pasada hubo una reunión importante.'},
     {stem:'There used to be a park in this neighborhood.',a:'Antes había un parque en este vecindario / colonia.'},
   ]},
  {type:'error',title:'C. Corrige el error (si lo hay)',
   qs:[

{level:'B1+',color:'var(--b1p)',icon:'🟣',title:'HAYA & HUBIERA',subtitle:'subjuntivo de existencia',
expl:{

  body:`Se usan cuando <strong>haber de existencia</strong> aparece después de expresiones de <em>duda, posibilidad, deseo, emoción o búsqueda</em>.<br><br>

    <div class="example-item" style="border-color:var(--b1p)">
      <div class="es">No creo que haya suficiente comida.</div>
      <div class="en">I don't think there is enough food.</div>

      <div class="es">Busco un hotel donde haya piscina.</div>

      <div class="es">Me gustaría que hubiera más parques en la ciudad.</div>
      <div class="en">I would like there to be more parks in the city.</div>
    </div>
    <div class="example-item" style="border-color:var(--b1p)">
      <div class="es">Si hubiera más oportunidades, menos personas se irían.</div>
      <div class="en">If there were more opportunities, fewer people would leave.</div>
    </div>
  </div>`,
},

    </div>

// ── TAB 5: MEZCLA FINAL B1 ───────────────────────────────────────────────────
{level:'B1',color:'var(--b1)',icon:'🔥',title:'Mezcla final',subtitle:'todos los usos de HABER',
expl:{

  body:`<table class="sum-table">

    <tr><td>hubiera hablado</td><td>pluscuamp. de subjuntivo</td><td>had spoken (subj.)</td></tr>
  </tbody></table>`,

flashcards:[],
exercises:[

   qs:[
     {stem:'There were many people at the station, but the train had already left.',a:'Había muchas personas en la estación, pero el tren ya había salido.'},

     {stem:'Es posible que haya un error en el documento.',a:"It's possible there is an error in the document."},

</script>
<script>
let currentSection='existencia';
const renderedTabs={existencia:new Set(),auxiliar:new Set()};
const answers={};

function normalize(s){
  return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[¿?¡!.,;:]/g,'').replace(/\s+/g,' ');
}
function checkAns(user,correct){
  const u=normalize(user);
  const alts=correct.split('/').map(a=>normalize(a));
  if(alts.some(a=>u===a||u.includes(a)||a.includes(u)))return true;
  const uClean=u.replace(/^(yo|tu|el|ella|usted|nosotros|nosotras|ellos|ellas|ustedes)\s+/,'')
               .replace(/por\s*/g,'')
               .replace(/\s+/g,' ').trim();
  return alts.some(a=>{
    const aC=a.replace(/^(yo|tu|el|ella|usted|nosotros|nosotras|ellos|ellas|ustedes)\s+/,'')
              .replace(/por\s*/g,'')
              .replace(/\s+/g,' ').trim();
    return uClean===aC||uClean.includes(aC)||aC.includes(uClean);
  });
}

function showSection(sec){
  currentSection=sec;
  document.querySelectorAll('.sec-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.sec-btn.'+sec).classList.add('active');
  buildTabsBar();
  const firstTab=document.getElementById('tabsBar').querySelector('.tab-btn');
  if(firstTab)firstTab.click();
}

function buildTabsBar(){
  const bar=document.getElementById('tabsBar');
  bar.innerHTML='';
  document.getElementById('tabContents').innerHTML='';
  renderedTabs[currentSection]=new Set();
  const tabs=SECTIONS[currentSection];
  const lvlColors={'A1':'var(--a1)','A2':'var(--a2)','B1':'var(--b1)','B1+':'var(--b1p)'};
  tabs.forEach((t,i)=>{
    const btn=document.createElement('button');
    btn.className='tab-btn'+(i===0?' active':'');
    const dot=`<span class="level-dot" style="background:${lvlColors[t.level]||'var(--muted2)'}"></span>`;
    btn.innerHTML=dot+t.icon+' '+t.title;
    btn.onclick=()=>switchTab(i);
    bar.appendChild(btn);
  });
  switchTab(0);
}

function switchTab(i){
  document.querySelectorAll('.tab-btn').forEach((b,j)=>b.classList.toggle('active',i===j));
  if(!renderedTabs[currentSection].has(i)){renderTab(i);renderedTabs[currentSection].add(i);}
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('visible'));
  const panel=document.getElementById(`panel_${currentSection}_${i}`);
  if(panel)panel.classList.add('visible');
}

function renderTab(i){
  const t=SECTIONS[currentSection][i];
  const container=document.getElementById('tabContents');
  const panel=document.createElement('div');
  panel.className='tab-panel visible';
  panel.id=`panel_${currentSection}_${i}`;
  const lvlColors={'A1':'var(--a1)','A2':'var(--a2)','B1':'var(--b1)','B1+':'var(--b1p)'};
  const lc=lvlColors[t.level]||'var(--muted)';
  let html=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
    <span style="font-family:var(--display);font-size:1.3rem;font-weight:900;color:${t.color}">${t.icon} ${t.title}</span>
    <span style="background:${lc}22;color:${lc};border:1px solid ${lc}44;border-radius:999px;padding:2px 10px;font-size:.68rem;font-weight:900">${t.level}</span>
  </div>
  <div style="font-size:.83rem;color:var(--muted2);margin-bottom:18px;font-style:italic">${t.subtitle}</div>`;

  // Explanation
  if(t.expl){
    html+=`<div class="expl-box">
      <div class="expl-title" style="color:${t.color}">📖 ${t.expl.title}</div>
      <div class="expl-body">${t.expl.body}</div>
    </div>`;
  }

  // Flashcards
  if(t.flashcards&&t.flashcards.length>0){
    html+=`<div class="ex-card" style="margin-bottom:16px">
    <div class="ex-title">🃏 Flashcards — haz clic para voltear</div>
    <div class="fc-nav">
      <button class="btn-fc" onclick="fcPrev('${currentSection}_${i}')">← Anterior</button>
      <span class="fc-counter" id="fcctr_${currentSection}_${i}">1 / ${t.flashcards.length}</span>
      <button class="btn-fc" onclick="fcNext('${currentSection}_${i}')">Siguiente →</button>
    </div>
    <div class="fc-scene" onclick="fcFlip('${currentSection}_${i}')">
      <div class="fc-card" id="fc_${currentSection}_${i}">
        <div class="fc-face fc-front">
          <div class="fc-label">FORMA</div>
          <div class="fc-form" id="fcfront_${currentSection}_${i}">${t.flashcards[0].front}</div>
          <div class="fc-eng" id="fcfrontsub_${currentSection}_${i}">${t.flashcards[0].frontSub||''}</div>
        </div>
        <div class="fc-face fc-back">
          <div class="fc-label">INGLÉS</div>
          <div class="fc-form" style="font-size:1.2rem" id="fcback_${currentSection}_${i}">${t.flashcards[0].back}</div>
          <div class="fc-example" id="fcex_${currentSection}_${i}">${t.flashcards[0].example||''}</div>
        </div>
      </div>
    </div></div>`;
  }

  // Exercises
  html+=`<div class="ex-wrap">`;
  t.exercises.forEach((ex,ei)=>{
    const key=`${currentSection}_${i}_${ei}`;
    html+=`<div class="ex-card">
    <div class="ex-header">
      <div class="ex-title">${ex.title}</div>
      <div class="score-row">
        <span class="score-pill" id="score_${key}">0 / ${ex.qs.length} respondidas</span>
        <button class="btn-restart" onclick="restartEx('${key}',${i},${ei})">🔄 Reiniciar</button>
      </div>
    </div>`;

    if(ex.type==='fill'){
      if(ex.wb){
        html+=`<div class="wordbank"><strong>Banco de palabras</strong>${ex.wb.join(' &nbsp;·&nbsp; ')}</div>`;
      }
      html+=`<div class="q-list">`;
      ex.qs.forEach((q,qi)=>{
        const qkey=`${key}_${qi}`;
        const parts=q.stem.split('___');
        const stemHTML=parts.length>=2
          ?`${parts[0]}<span class="blank" id="blank_${qkey}"></span>${parts.slice(1).join('___')}`
          :q.stem;
        html+=`<div class="q-item" id="qitem_${qkey}">
          <div class="q-stem"><span class="q-num">${qi+1}.</span> ${stemHTML}</div>
          ${q.sub?`<div class="q-sub">${q.sub}</div>`:''}
          <div class="chip-row" id="chips_${qkey}">
            ${ex.wb.map(w=>`<button class="chip" onclick="answerChip('${qkey}','${w.replace(/'/g,"\\'")}','${q.a.replace(/'/g,"\\'")}','${key}')">${w}</button>`).join('')}
          </div>
          <div class="q-fb" id="fb_${qkey}"></div>
        </div>`;
      });
      html+=`</div>`;

    } else if(ex.type==='translate'){
      html+=`<div class="q-list">`;
      ex.qs.forEach((q,qi)=>{
        const qkey=`${key}_${qi}`;
        html+=`<div class="q-item" id="qitem_${qkey}">
          <div class="q-stem"><span class="q-num">${qi+1}.</span> ${q.stem}</div>
          ${q.sub?`<div class="q-sub">${q.sub}</div>`:''}
          <input type="text" class="q-input" id="inp_${qkey}" placeholder="Escribe tu traducción..."
            onkeydown="if(event.key==='Enter')checkTranslate('${qkey}','${q.a.replace(/'/g,"\\'")}','${key}')">
          <button class="btn-check" onclick="checkTranslate('${qkey}','${q.a.replace(/'/g,"\\'")}','${key}')">Verificar ✓</button>
          <div class="q-fb" id="fb_${qkey}"></div>
        </div>`;
      });
      html+=`</div>`;

    } else if(ex.type==='error'){
      html+=`<div class="q-list">`;
      ex.qs.forEach((q,qi)=>{
        const qkey=`${key}_${qi}`;
        html+=`<div class="q-item" id="qitem_${qkey}">
          <div class="q-stem"><span class="q-num">${qi+1}.</span> 🔍 <em>${q.stem}</em></div>
          <div class="q-sub">¿Hay un error? Si sí, corrígelo. Si no, escribe "correcta".</div>
          <input type="text" class="q-input" id="inp_${qkey}" placeholder="Tu respuesta..."
            onkeydown="if(event.key==='Enter')checkError('${qkey}','${q.a.replace(/'/g,"\\'")}','${(q.fb||'').replace(/'/g,"\\'")}','${key}')">
          <button class="btn-check" onclick="checkError('${qkey}','${q.a.replace(/'/g,"\\'")}','${(q.fb||'').replace(/'/g,"\\'")}','${key}')">Verificar ✓</button>
          <div class="q-fb" id="fb_${qkey}"></div>
        </div>`;
      });
      html+=`</div>`;
    }

    html+=`</div>`;
  });
  html+=`</div>`;
  panel.innerHTML=html;
  container.appendChild(panel);

  // Init flashcard state
  if(t.flashcards&&t.flashcards.length>0){
    fcState[`${currentSection}_${i}`]={idx:0,flipped:false,cards:t.flashcards};
  }
}

// ── FLASHCARD ENGINE ──────────────────────────────────────────────────────────
const fcState={};
function fcFlip(key){
  const card=document.getElementById('fc_'+key);
  const s=fcState[key];if(!s)return;
  s.flipped=!s.flipped;
  card.classList.toggle('flipped',s.flipped);
}
function fcNext(key){
  const s=fcState[key];if(!s)return;
  s.idx=(s.idx+1)%s.cards.length;s.flipped=false;fcUpdate(key);
}
function fcPrev(key){
  const s=fcState[key];if(!s)return;
  s.idx=(s.idx-1+s.cards.length)%s.cards.length;s.flipped=false;fcUpdate(key);
}
function fcUpdate(key){
  const s=fcState[key];
  const card=document.getElementById('fc_'+key);
  if(card)card.classList.remove('flipped');
  const c=s.cards[s.idx];
  const ff=document.getElementById('fcfront_'+key);if(ff)ff.textContent=c.front;
  const fs=document.getElementById('fcfrontsub_'+key);if(fs)fs.textContent=c.frontSub||'';
  const fb=document.getElementById('fcback_'+key);if(fb)fb.textContent=c.back;
  const fe=document.getElementById('fcex_'+key);if(fe)fe.textContent=c.example||'';
  const ctr=document.getElementById('fcctr_'+key);if(ctr)ctr.textContent=(s.idx+1)+' / '+s.cards.length;
}

// ── ANSWER FUNCTIONS ──────────────────────────────────────────────────────────
function answerChip(qkey,chosen,correct,key){
  if(answers[qkey]!==undefined)return;
  const ok=normalize(chosen)===normalize(correct);
  answers[qkey]=ok;
  const blank=document.getElementById('blank_'+qkey);
  if(blank){blank.textContent=chosen;blank.style.color=ok?'var(--good)':'var(--bad)';}
  document.querySelectorAll(`#chips_${qkey} .chip`).forEach(btn=>{
    btn.disabled=true;
    if(normalize(btn.textContent)===normalize(chosen))btn.classList.add(ok?'chip-ok':'chip-err');
    else btn.classList.add('used');
  });
  const fb=document.getElementById('fb_'+qkey);
  if(fb){fb.innerHTML=ok?'✅ ¡Correcto!':'❌ Respuesta correcta: <strong>'+correct+'</strong>';fb.classList.add('show');}
  updateScore(key);
}

function checkTranslate(qkey,correct,key){
  if(answers[qkey]!==undefined)return;
  const inp=document.getElementById('inp_'+qkey);
  if(!inp||!inp.value.trim()){alert('Escribe tu respuesta primero.');return;}
  const ok=checkAns(inp.value,correct);
  answers[qkey]=ok;
  inp.disabled=true;inp.classList.add(ok?'inp-ok':'inp-err');
  const fb=document.getElementById('fb_'+qkey);
  if(fb){fb.innerHTML=ok?'✅ ¡Muy bien!':'❌ Referencia: <strong>'+correct+'</strong>';fb.classList.add('show');}
  const btn=inp.nextElementSibling;if(btn)btn.disabled=true;
  updateScore(key);
}

function checkError(qkey,correct,fbText,key){
  if(answers[qkey]!==undefined)return;
  const inp=document.getElementById('inp_'+qkey);
  if(!inp||!inp.value.trim()){alert('Escribe tu respuesta primero.');return;}
  const ok=checkAns(inp.value,correct);
  answers[qkey]=ok;
  inp.disabled=true;inp.classList.add(ok?'inp-ok':'inp-err');
  const fb=document.getElementById('fb_'+qkey);
  if(fb){fb.innerHTML=(ok?'✅ ':'❌ ')+(fbText||('Respuesta correcta: <strong>'+correct+'</strong>'));fb.classList.add('show');}
  const btn=inp.nextElementSibling;if(btn)btn.disabled=true;
  updateScore(key);
}

function updateScore(key){
  const parts=key.split('_');
  const sec=parts[0],ti=parseInt(parts[1]),ei=parseInt(parts[2]);
  const ex=SECTIONS[sec][ti].exercises[ei];
  const done=ex.qs.filter((_,qi)=>answers[`${key}_${qi}`]!==undefined).length;
  const sc=document.getElementById('score_'+key);if(sc)sc.textContent=done+' / '+ex.qs.length+' respondidas';
}

function restartEx(key,ti,ei){
  const sec=currentSection;
  const ex=SECTIONS[sec][ti].exercises[ei];
  ex.qs.forEach((_,qi)=>{
    const qkey=`${key}_${qi}`;
    delete answers[qkey];
    const blank=document.getElementById('blank_'+qkey);if(blank){blank.textContent='';blank.style.color='var(--cyan)';}
    document.querySelectorAll(`#chips_${qkey} .chip`).forEach(b=>{b.disabled=false;b.className='chip';});
    const inp=document.getElementById('inp_'+qkey);if(inp){inp.disabled=false;inp.value='';inp.className='q-input';}
    const fb=document.getElementById('fb_'+qkey);if(fb){fb.innerHTML='';fb.className='q-fb';}
    const item=document.getElementById('qitem_'+qkey);
    if(item){const btn=item.querySelector('.btn-check');if(btn)btn.disabled=false;}
  });
  updateScore(key);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
showSection('existencia');
</script>
